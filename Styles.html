<style>
  /* ==========================================================================
     Aplikasi Latihan Soal SD - CSS Global & Komponen
     Desain: Modern, Ceria, Aksesibel Ramah Anak SD & Profesional Guru
     ========================================================================== */

  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-light: #eff6ff;
    --secondary: #10b981;
    --secondary-hover: #059669;
    --accent-amber: #f59e0b;
    --accent-red: #ef4444;
    --accent-purple: #8b5cf6;
    
    --bg-main: #f8fafc;
    --bg-card: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --text-light: #94a3b8;
    --border: #e2e8f0;
    --border-focus: #3b82f6;

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --radius-full: 9999px;

    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 10px 25px rgba(0,0,0,0.1);

    --font-family: 'Comic Neue', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: var(--font-family);
    background-color: var(--bg-main);
    color: var(--text-main);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* Utility Classes */
  .hidden { display: none !important; }
  .text-center { text-align: center; }
  .text-right { text-align: right; }
  .font-bold { font-weight: 700; }
  .text-muted { color: var(--text-muted); }
  .text-primary { color: var(--primary); }
  .text-success { color: var(--secondary); }
  .text-danger { color: var(--accent-red); }
  
  .flex { display: flex; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }
  .justify-center { justify-content: center; }
  .flex-wrap { flex-wrap: wrap; }
  .gap-2 { gap: 8px; }
  .gap-3 { gap: 12px; }
  .gap-4 { gap: 16px; }

  /* Tombol Utama */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 20px;
    font-size: 15px;
    font-weight: 600;
    border-radius: var(--radius-md);
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
    user-select: none;
    min-height: 44px;
  }

  .btn:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }

  .btn:active {
    transform: translateY(0);
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none !important;
  }

  .btn-primary {
    background-color: var(--primary);
    color: #ffffff;
  }
  .btn-primary:hover { background-color: var(--primary-hover); }

  .btn-secondary {
    background-color: #f1f5f9;
    color: var(--text-main);
  }
  .btn-secondary:hover { background-color: #e2e8f0; }

  .btn-success {
    background-color: var(--secondary);
    color: #ffffff;
  }
  .btn-success:hover { background-color: var(--secondary-hover); }

  .btn-warning {
    background-color: var(--accent-amber);
    color: #ffffff;
  }
  .btn-warning:hover { background-color: #d97706; }

  .btn-danger {
    background-color: var(--accent-red);
    color: #ffffff;
  }
  .btn-danger:hover { background-color: #dc2626; }

  .btn-lg {
    padding: 14px 28px;
    font-size: 18px;
    border-radius: var(--radius-lg);
    min-height: 52px;
  }

  .btn-sm {
    padding: 6px 12px;
    font-size: 13px;
    border-radius: var(--radius-sm);
    min-height: 32px;
  }

  /* Form Inputs */
  .form-group {
    margin-bottom: 16px;
    text-align: left;
  }

  .form-label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text-main);
  }

  .form-control {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 2px solid var(--border);
    border-radius: var(--radius-md);
    background-color: #ffffff;
    color: var(--text-main);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .form-control:focus {
    outline: none;
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
  }

  textarea.form-control {
    min-height: 80px;
    resize: vertical;
  }

  /* Badges */
  .badge {
    display: inline-block;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 700;
    border-radius: var(--radius-full);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .badge-primary { background-color: #dbeafe; color: #1e40af; }
  .badge-success { background-color: #d1fae5; color: #065f46; }
  .badge-warning { background-color: #fef3c7; color: #92400e; }
  .badge-danger { background-color: #fee2e2; color: #991b1b; }
  .badge-secondary { background-color: #f1f5f9; color: #475569; }

  /* Kartu & Container */
  .card {
    background-color: var(--bg-card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    padding: 24px;
    margin-bottom: 20px;
  }

  /* Toast Notification */
  #toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
  }

  .toast {
    pointer-events: auto;
    padding: 14px 20px;
    border-radius: var(--radius-md);
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: center;
    gap: 10px;
    animation: slideInToast 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    max-width: 360px;
  }

  @keyframes slideInToast {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  .toast-success { background-color: var(--secondary); }
  .toast-error { background-color: var(--accent-red); }
  .toast-warning { background-color: var(--accent-amber); }
  .toast-info { background-color: var(--primary); }

  /* Modal Dialog */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    padding: 16px;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal-content {
    background: #ffffff;
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    padding: 24px;
    position: relative;
    animation: scaleUp 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .modal-lg { max-width: 850px; }

  @keyframes scaleUp {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .modal-title {
    font-size: 20px;
    font-weight: 700;
  }

  .modal-close {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: var(--text-muted);
  }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  /* Loading State */
  .spinner {
    width: 24px;
    height: 24px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
  }

  .spinner-dark {
    border: 3px solid rgba(0,0,0,0.1);
    border-top-color: var(--primary);
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
  }

  .empty-icon {
    font-size: 54px;
    margin-bottom: 16px;
    opacity: 0.8;
  }

  .empty-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  /* Table Style */
  .table-responsive {
    overflow-x: auto;
    width: 100%;
    margin-top: 12px;
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 14px;
  }

  .data-table th {
    background-color: #f8fafc;
    color: var(--text-muted);
    font-weight: 700;
    padding: 12px 14px;
    border-bottom: 2px solid var(--border);
  }

  .data-table td {
    padding: 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  .data-table tr:hover td {
    background-color: #f8fafc;
  }

  /* ==========================================================================
     LAYOUT KHUSUS GURU
     ========================================================================== */
  .teacher-wrapper {
    display: flex;
    min-height: 100vh;
  }

  .teacher-sidebar {
    width: 260px;
    background-color: #1e293b;
    color: #f8fafc;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    transition: transform 0.3s ease;
    z-index: 1000;
  }

  .sidebar-header {
    padding: 20px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sidebar-logo {
    font-size: 20px;
    font-weight: 800;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sidebar-menu {
    list-style: none;
    padding: 16px 12px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .sidebar-item a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    color: #94a3b8;
    text-decoration: none;
    font-weight: 600;
    border-radius: var(--radius-md);
    transition: all 0.2s;
  }

  .sidebar-item a:hover {
    background-color: rgba(255,255,255,0.08);
    color: #ffffff;
  }

  .sidebar-item.active a {
    background-color: var(--primary);
    color: #ffffff;
  }

  .sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid rgba(255,255,255,0.1);
    font-size: 13px;
    color: #94a3b8;
  }

  .teacher-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .teacher-header {
    background-color: #ffffff;
    height: 64px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .mobile-menu-btn {
    display: none;
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: var(--text-main);
  }

  .teacher-content {
    padding: 24px;
    flex: 1;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .stat-icon {
    width: 52px;
    height: 52px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }

  .stat-val {
    font-size: 26px;
    font-weight: 800;
    color: var(--text-main);
    line-height: 1.1;
  }

  .stat-lbl {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
  }

  /* ==========================================================================
     LAYOUT KHUSUS SISWA (CERIA, RAMAH ANAK SD, TOMBOL BESAR)
     ========================================================================== */
  .student-wrapper {
    max-width: 820px;
    margin: 0 auto;
    padding: 20px 16px 80px;
    min-height: 100vh;
  }

  .student-topbar {
    background: #ffffff;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    padding: 14px 20px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 12px;
    z-index: 50;
  }

  .timer-badge {
    background-color: #fef3c7;
    color: #92400e;
    font-weight: 800;
    padding: 8px 16px;
    border-radius: var(--radius-full);
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: inset 0 0 0 1px rgba(180, 83, 9, 0.2);
  }

  .timer-badge.urgent {
    background-color: #fee2e2;
    color: #b91c1c;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .autosave-status {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .question-container {
    background: #ffffff;
    border-radius: var(--radius-lg);
    border: 2px solid #e2e8f0;
    box-shadow: var(--shadow-md);
    padding: 28px 24px;
    margin-bottom: 20px;
  }

  .question-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px dashed #f1f5f9;
  }

  .question-number {
    font-size: 18px;
    font-weight: 800;
    color: var(--primary);
  }

  .question-text {
    font-size: 19px;
    font-weight: 600;
    color: var(--text-main);
    line-height: 1.6;
    margin-bottom: 20px;
  }

  .question-image {
    max-width: 100%;
    max-height: 350px;
    object-fit: contain;
    border-radius: var(--radius-md);
    margin-bottom: 20px;
    border: 1px solid var(--border);
  }

  /* Pilihan Jawaban Ramah Anak */
  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .option-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    background-color: #f8fafc;
    border: 2px solid var(--border);
    border-radius: var(--radius-lg);
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
    min-height: 60px;
  }

  .option-card:hover {
    border-color: #cbd5e1;
    background-color: #f1f5f9;
  }

  .option-card.selected {
    background-color: #eff6ff;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .option-badge {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background-color: #ffffff;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 800;
    color: var(--text-main);
    flex-shrink: 0;
  }

  .option-card.selected .option-badge {
    background-color: var(--primary);
    border-color: var(--primary);
    color: #ffffff;
  }

  .option-label {
    font-size: 17px;
    font-weight: 600;
    color: var(--text-main);
    flex: 1;
  }

  /* Tombol Benar / Salah */
  .bs-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .btn-bs {
    padding: 20px;
    font-size: 20px;
    font-weight: 800;
    border-radius: var(--radius-lg);
    border: 3px solid var(--border);
    background-color: #ffffff;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .btn-bs.selected-benar {
    background-color: #d1fae5;
    border-color: var(--secondary);
    color: #065f46;
  }

  .btn-bs.selected-salah {
    background-color: #fee2e2;
    border-color: var(--accent-red);
    color: #991b1b;
  }

  /* Palet Nomor Soal */
  .question-palette {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 20px;
    padding: 16px;
    background: #ffffff;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
  }

  .palette-btn {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-md);
    border: 2px solid var(--border);
    background: #f8fafc;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .palette-btn.current {
    box-shadow: 0 0 0 3px var(--primary);
  }

  .palette-btn.answered {
    background-color: #d1fae5;
    border-color: var(--secondary);
    color: #065f46;
  }

  .palette-btn.flagged {
    background-color: #fef3c7;
    border-color: var(--accent-amber);
    color: #92400e;
  }

  /* Mobile Responsive */
  @media (max-width: 768px) {
    .teacher-sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      transform: translateX(-100%);
    }

    .teacher-sidebar.open {
      transform: translateX(0);
    }

    .mobile-menu-btn {
      display: block;
    }

    .teacher-content {
      padding: 16px;
    }

    .question-container {
      padding: 20px 16px;
    }

    .btn-lg {
      padding: 12px 20px;
      font-size: 16px;
    }
  }
</style>
